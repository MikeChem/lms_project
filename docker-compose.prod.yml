# docker-compose.prod.yml

services:
  web:
    image: ghcr.io/mikechem/lms_web:latest
    container_name: lms_web
    ports:
      - "8001:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,89.169.174.214"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - backend

  db:
    image: postgres:16
    container_name: lms_db
    restart: always
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mike_Lash007
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: lms_redis
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: