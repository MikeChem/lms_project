        '204':
          description: No response body
  /api/users/login/:
    post:
      operationId: api_users_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTokenObtainPair'
          description: ''
  /api/users/register/:
    post:
      operationId: api_users_register_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
components:
  schemas:
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название курса
          maxLength: 255
        description:
          type: string
          nullable: true
          title: Описание
        owner:
          type: integer
          nullable: true
          title: Владелец
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
      required:
      - id
      - lessons
      - title
    Lesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название урока
          maxLength: 255
        description:
          type: string
          nullable: true
          title: Описание
        preview:
          type: string
          format: uri
          nullable: true
          title: Превью
        video_url:
          type: string
          format: uri
        course:
          type: integer
          title: Курс
      required:
      - course
      - id
      - title
      - video_url
    MyTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PatchedCourse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название курса
          maxLength: 255
        description:
          type: string
          nullable: true
          title: Описание
        owner:
          type: integer
          nullable: true
          title: Владелец
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'
          readOnly: true
    PatchedLesson:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Название урока
          maxLength: 255
        description:
          type: string
          nullable: true
          title: Описание
        preview:
          type: string
          format: uri
          nullable: true
          title: Превью
        video_url:
          type: string
          format: uri
        course:
          type: integer
          title: Курс
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        city:
          type: string
          nullable: true
          maxLength: 100
        avatar:
          type: string
          format: uri
          readOnly: true
          nullable: true
      required:
      - avatar
      - email
      - id
      - password
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
