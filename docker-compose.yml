version: '3.8'

# Дефолтная сеть
networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

services:
  # База данных PostgreSQL
  db:
    image: postgres:16
    container_name: lms_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # Redis
  redis:
    image: redis:7
    container_name: lms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  # MailHog для тестирования email
  mailhog:
    image: mailhog/mailhog
    container_name: lms_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - backend

  # Django web-приложение
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
      - mailhog
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - backend

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_celery_worker
    command: celery -A config worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - .:/app
    networks:
      - backend

  # Celery Beat (периодические задачи)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_celery_beat
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DJANGO_CELERY_BEAT_SCHEDULE_FILENAME=/tmp/celerybeat-schedule
    volumes:
      - .:/app
    networks:
      - backend