# docker-compose.yml

services:
  web:
    build: .
    container_name: lms_web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,89.169.174.214"
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - backend

  db:
    image: postgres:16
    container_name: lms_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7
    container_name: lms_redis
    ports:
      - "6379:6379"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: