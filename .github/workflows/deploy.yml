name: CI/CD Pipeline

on:
  push:
    branches:
      - feature_8_docker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker via get-docker.sh
        run: |
          # Удаляем старые версии
          sudo apt remove -y docker docker-engine docker.io containerd runc || true
          sudo rm -rf /var/lib/docker /etc/docker || true

          # Ставим свежий Docker через официальный скрипт
          curl -fsSL https://get.docker.com  -o get-docker.sh
          sudo sh get-docker.sh

          # Проверяем установку
          docker --version

      - name: Install Docker Compose
        run: |
          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          mkdir -p $DOCKER_CONFIG/cli-plugins
          curl -SL https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-linux-x86_64  \
            -o $DOCKER_CONFIG/cli-plugins/docker-compose
          chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
          sudo ln -s $DOCKER_CONFIG/cli-plugins/docker-compose /usr/local/bin/docker-compose
          docker-compose --version

      - name: Build and Start Services
        run: |
          docker-compose build
          docker-compose up -d db redis mailhog

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker-compose exec -T db pg_isready -h db -U $DB_USER -d $DB_NAME; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Apply migrations
        run: |
          docker-compose run --rm web python manage.py migrate

      - name: Run tests in Django container
        run: |
          docker-compose run --rm web python manage.py test

      - name: Run linter (flake8)
        run: |
          docker-compose run --rm web flake8 . --exit-zero

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo " Переходим в каталог проекта"
            cd ~/lms_project || { echo "❌ Директория ~/lms_project не найдена"; exit 1; }

            echo " Получаем последние изменения из Git"
            git stash || true
            git fetch origin
            git checkout feature_8_docker
            git pull origin feature_8_docker

            echo " Останавливаем текущие контейнеры"
            docker compose down || true

            echo " Запускаем сборку и обновление контейнеров"
            docker compose up -d --build

            echo " Выполняем миграции"
            docker compose exec web python manage.py migrate --noinput

            echo " Собираем статические файлы"
            docker compose exec web python manage.py collectstatic --noinput