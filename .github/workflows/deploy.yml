name: CI/CD Pipeline

on:
  push:
    branches:
      - feature_8_docker  # Запускать workflow при push в ветку feature_8_docker

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.13
        uses: actions/setup-python@v3
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up database
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db
        run: |
          python manage.py migrate
      - name: Run tests
        run: python manage.py test

  deploy:
    needs: test  # Этот job запустится только после успешного завершения job test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}  # IP-адрес вашего сервера
          username: ${{ secrets.SSH_USERNAME }}  # Имя пользователя на сервере
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Приватный ключ SSH
          port: 22  # Порт SSH (по умолчанию 22)
          script: |
            cd ~/lms_project
            git pull origin feature_8_docker # Pull changes from feature_8_docker branch
            source venv/bin/activate
            pip install -r requirements.txt  # Обновить зависимости
            python manage.py migrate
            python manage.py collectstatic --noinput
            #Restart Gunicorn
            kill -9 $(pidof gunicorn) || true
            gunicorn config.wsgi:application --bind 0.0.0.0:8000 &
