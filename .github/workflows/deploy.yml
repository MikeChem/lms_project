name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_9_docker_cicd

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo " Переходим в каталог проекта"
            cd ~/lms_project || { echo "❌ Директория ~/lms_project не найдена"; exit 1; }

            echo " Получаем последние изменения из Git"
            git stash || true
            git fetch origin
            git checkout feature_9_docker_cicd
            git pull origin feature_9_docker_cicd

            echo " Останавливаем текущие контейнеры"
            docker compose down || true

            echo " Собираем и запускаем контейнеры"
            docker compose up -d --build

            echo " Выполняем миграции"
            docker compose exec web python manage.py migrate --noinput

            echo " Собираем статику"
            docker compose exec web python manage.py collectstatic --noinput