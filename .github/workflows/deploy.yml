name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_9_docker_cicd

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/mikechem/lms_web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo " Переходим в каталог проекта"
            cd ~/lms_project || { echo "❌ Директория ~/lms_project не найдена"; exit 1; }

            echo " Получаем последние изменения из Git"
            git stash || true
            git fetch origin
            git checkout feature_9_docker_cicd
            git pull origin feature_9_docker_cicd

            echo " Останавливаем текущие контейнеры"
            docker compose -f docker-compose.prod.yml down

            echo " Авторизуемся в GitHub Container Registry"
            docker login ghcr.io -u mikechem --password-stdin <<< "${{ secrets.SSH_DOCKER_REGISTRY_PASSWORD }}"

            echo " Скачиваем новый образ"
            docker pull ghcr.io/mikechem/lms_web:latest

            echo " Запускаем контейнеры"
            docker compose -f docker-compose.prod.yml up -d