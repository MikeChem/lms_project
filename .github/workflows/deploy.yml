name: CI/CD Pipeline

on:
  push:
    branches:
      - feature_8_docker # Запускать workflow при push в ветку develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"  # Укажите вашу версию Python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

  deploy:
    needs: test  # Этот job запустится только после успешного завершения job test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}  # IP-адрес вашего сервера
          username: ${{ secrets.SSH_USERNAME }}  # Имя пользователя на сервере
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Приватный ключ SSH
          port: 22  # Порт SSH (по умолчанию 22)
          script: |
            cd ~/lms_project
            git pull origin develop
            source venv/bin/activate
            pip install -r requirements.txt  # Обновить зависимости
            python manage.py migrate
            python manage.py collectstatic --noinput
            #Restart Gunicorn
            kill -9 $(pidof gunicorn) || true
            gunicorn config.wsgi:application --bind 0.0.0.0:8000 &
