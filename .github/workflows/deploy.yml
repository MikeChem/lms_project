name: CI/CD Pipeline with Docker

on:
  push:
    branches:
      - feature_8_docker

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose- $(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Check Docker Compose version
        run: docker-compose --version

      - name: Build Docker images
        run: |
          docker-compose build

      - name: Run tests inside Django container
        run: |
          docker-compose run --rm web python manage.py test

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.5
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy files and deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Переходим в папку проекта или создаём, если нет
            mkdir -p ~/lms_project
            cd ~/lms_project

            echo "Очистка старых файлов..."
            rm -rf ./* .env .gitignore || true

            echo "Копируем новые файлы..."
            rsync -avz --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' ../ ~/lms_project/

            echo "Проверяем наличие .env"
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            echo "Подтягиваем изменения и пересобираем..."
            docker-compose down
            docker-compose up -d --build

            echo "Миграции..."
            docker-compose exec web python manage.py migrate

            echo "Статика..."
            docker-compose exec web python manage.py collectstatic --noinput --clear